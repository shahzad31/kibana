name: clone-timing

on:
  push:
    branches: [clone-timing]

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm init -y >/dev/null && npm i backport@^12.1.2
      - name: Dry-run backports with the options used by the action
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/dry_run.mjs
