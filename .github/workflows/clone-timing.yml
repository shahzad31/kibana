name: clone-timing

on:
  push:
    branches: [clone-timing]

jobs:
  blobless:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - name: Time blobless clone and backport-style work
        run: |
          set -x
          SECONDS=0
          git clone --filter=blob:none https://github.com/elastic/kibana.git "$RUNNER_TEMP/kibana"
          clone_s=$SECONDS
          cd "$RUNNER_TEMP/kibana"
          du -sh .git

          git config user.email t@example.com && git config user.name t
          SECONDS=0
          git fetch origin 9.5
          git checkout -q -b bp origin/9.5
          fetch_s=$SECONDS

          SECONDS=0
          git cherry-pick -x f5258057cfe3f909cc720136e3153e88574ca73e
          git cherry-pick -x 45dcbbee172aa183e74d3b40497f8096e446ce0b
          pick_s=$SECONDS

          echo "| run ${{ matrix.run }} | clone ${clone_s}s | fetch+checkout ${fetch_s}s | cherry-pick x2 ${pick_s}s | total $((clone_s+fetch_s+pick_s))s |" | tee -a "$GITHUB_STEP_SUMMARY"
